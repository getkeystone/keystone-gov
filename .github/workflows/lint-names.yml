name: lint-names
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check-forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for customer-specific strings (warning only)
        run: |
          PATTERN='long reach|saint john fire'
          if grep -rniP --include="*.py" "$PATTERN" api/; then
            echo "WARNING: customer-specific string found"
          fi
          echo "OK: lint passed (lrfd references tracked in issue)"
